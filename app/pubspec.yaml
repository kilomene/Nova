name: nova
description: Nova — short-video social + wallet + P2P + marketplace.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.3
  video_player: ^2.9.2
  file_picker: ^8.1.2
  fc_native_video_thumbnail: ^4.0.0
  local_auth: ^2.3.0
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  web_socket_channel: ^3.0.2
  url_launcher: ^6.3.1
  firebase_core: ^3.10.0
  firebase_auth: ^5.3.4
  firebase_messaging: ^15.2.0
  # Wallet crypto (see lib/services/wallet_crypto.dart)
  bip39: ^1.0.6
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  bs58: ^1.0.2
  web3dart: ^2.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
